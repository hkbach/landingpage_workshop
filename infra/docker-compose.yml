services:
  db:
    image: postgres:16
    container_name: workshop-db
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: workshop
    ports:
      - "127.0.0.1:5432:5432"   # chỉ máy bạn kết nối được
    volumes:
      - workshop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Development only: catches every email the API sends (nothing leaves the machine). Read them at http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: workshop-mailpit
    ports:
      - "127.0.0.1:1025:1025"   # SMTP (the API sends here)
      - "127.0.0.1:8025:8025"   # web interface

volumes:
  workshop-db-data: