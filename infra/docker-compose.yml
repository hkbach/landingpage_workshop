services:
  db:
    image: postgres:16
    container_name: workshop-db
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: workshop
    ports:
      - "127.0.0.1:5432:5432"   # chỉ máy bạn kết nối được
    volumes:
      - workshop-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workshop -d workshop"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  workshop-db-data: